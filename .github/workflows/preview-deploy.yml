name: Preview Deployment

on:
  pull_request:
    branches: [main, develop]

jobs:
  preview-info:
    name: Preview Deployment Info
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const comment = `## 🚀 Preview Deployment
            
            Your preview deployment will be automatically created by Vercel.
            
            ### Preview URL
            Vercel will comment on this PR with the preview URL once deployment is complete.
            
            ### What's being deployed:
            - **Branch**: \`${pr.head.ref}\`
            - **Commit**: \`${pr.head.sha.substring(0, 7)}\`
            - **Author**: @${pr.user.login}
            
            ### Build Status
            Check the [Vercel dashboard](https://vercel.com) for real-time deployment status.
            
            ---
            *Powered by Vercel automatic deployments* ⚡`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
